# taloshw — everything this cluster runs. Applied once by hand
# (kubectl apply -f), reconciled by Argo from then on.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: argocd
  namespace: argocd
spec:
  project: default
  sources:
    - repoURL: https://argoproj.github.io/argo-helm
      chart: argo-cd
      targetRevision: 10.1.2
      helm:
        releaseName: argocd
        valueFiles:
          - $values/projects/argocd/values-taloshw.yaml
    - repoURL: https://github.com/alanlaird/gitops
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    # Deliberately manual: Argo upgrading itself should be a chosen moment,
    # not a background surprise on a prod-pair member.
    syncOptions:
      - ServerSideApply=true
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: media
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/alanlaird/gitops
    targetRevision: main
    path: projects/media/overlays/taloshw
  destination:
    server: https://kubernetes.default.svc
    namespace: media
  syncPolicy:
    syncOptions:
      - ServerSideApply=true
    # manual for now — flip to automated+selfHeal once the pattern is
    # proven across a few apps (Phase 5.5 cadence)
