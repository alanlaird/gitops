# KSOPS generator for this project's per-app Secrets. NOT YET wired into
# kustomization.yaml's `generators:` — add that line once the first
# secrets/*.sops.yaml file actually exists (SABnzbd's migration is first),
# since ksops errors on a `files:` entry that doesn't exist on disk.
apiVersion: viaduct.ai/v1
kind: ksops
metadata:
  name: media-secrets
  annotations:
    config.kubernetes.io/function: |
      exec:
        path: ksops
files:
  # - ./secrets/sabnzbd.sops.yaml
  # - ./secrets/prowlarr.sops.yaml
  # - ./secrets/radarr.sops.yaml
  # - ./secrets/sonarr.sops.yaml
  # - ./secrets/bazarr.sops.yaml
  # - ./secrets/webui-auth.sops.yaml
  # - ./buildarr/config.sops.yaml
