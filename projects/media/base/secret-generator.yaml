# KSOPS generator for this project's per-app Secrets. Files get uncommented
# below as each app migrates.
apiVersion: viaduct.ai/v1
kind: ksops
metadata:
  name: media-secrets
  annotations:
    config.kubernetes.io/function: |
      exec:
        path: ksops
files:
