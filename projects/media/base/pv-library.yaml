# Static NFS-CSI PVs for the 7 branches fir's mergerfs_pool unions (see
# ansible-homelab:nodes/fir.yml). Read-write — this is the production
# mergerfs pattern, validated read-only in terraform/taloshw/k8s/media-nfs-test/
# and confirmed for real writes/hardlinks/branch-loss/concurrent-access
# there before being adopted here.
#
# nfsvers=3,nolock: ophir/bullards (QNAP) don't run NFSv4 like agate does —
# v4.1 mounts fail with "Protocol not supported", and default v3 fails with
# "rpc.statd is not running" because the csi-nfs-node container has no rpc
# services. nolock avoids needing statd.
#
# Cluster-scoped (not namespaced) — shared by every mergerfs-sidecar app
# (tubesync, radarr, sonarr, bazarr) via the same PVC names.
apiVersion: v1
kind: PersistentVolume
metadata:
  name: media-pool-media1
spec:
  capacity:
    storage: 1Gi
  accessModes: [ReadWriteMany]
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
  mountOptions: [nfsvers=3, nolock]
  csi:
    driver: nfs.csi.k8s.io
    volumeHandle: media-pool-media1
    volumeAttributes:
      server: "172.16.11.51" # ophir
      share: /share/CACHEDEV4_DATA/media
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: media1
  namespace: media
spec:
  accessModes: [ReadWriteMany]
  storageClassName: ""
  volumeName: media-pool-media1
  resources:
    requests:
      storage: 1Gi
---
