# Migrated from fir's podman pet (roles/media/tasks/sonarr.yml). Root
# folders /pool/tv and /pool/anime/tv need read-write /pool access, so this
# app gets the mergerfs sidecar (exact pattern validated in media-nfs-test,
# switched ReadOnlyMany -> ReadWriteMany). API key rotation happens once, at
# data migration time (edited directly into config.xml before first boot --
# see the migration runbook, config.xml is Sonarr's real source of truth for
# its key, read once at startup, not live-settable via the API). Ongoing
# settings drift (download client host, root folders) is corrected by
# sonarr-reconcile/, not ansible. DOCKER_MODS carried over from fir --
# strips unwanted audio/subtitle tracks on import, same mod Radarr uses
# (the "radarr-" prefix in the mod name is just its origin, it works for
# any Servarr app that fires the same on-import custom script event).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sonarr
  namespace: media
spec:
  replicas: 1
  strategy:
    type: Recreate # RWO Longhorn config volume
  selector:
    matchLabels: { app: sonarr }
  template:
    metadata:
      labels: { app: sonarr }
    spec:
      containers:
        - name: mergerfs
          image: alpine:edge
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -euo pipefail
              echo "@testing http://dl-cdn.alpinelinux.org/alpine/edge/testing" >> /etc/apk/repositories
              apk add --no-cache fuse3 mergerfs@testing
              exec mergerfs -f \
                -o allow_other,use_ino,cache.files=partial,dropcacheonclose=true,category.create=mfs,minfreespace=20G \
                /branches/media1:/branches/media2:/branches/media3:/branches/media4:/branches/media5:/branches/media6:/branches/media7 \
                /pool
          securityContext:
            privileged: true # Bidirectional propagation requires this
          volumeMounts:
            - { name: media1, mountPath: /branches/media1 }
            - { name: media2, mountPath: /branches/media2 }
            - { name: media3, mountPath: /branches/media3 }
            - { name: media4, mountPath: /branches/media4 }
            - { name: media5, mountPath: /branches/media5 }
            - { name: media6, mountPath: /branches/media6 }
            - { name: media7, mountPath: /branches/media7 }
            - { name: fuse, mountPath: /dev/fuse }
            - { name: pool, mountPath: /pool, mountPropagation: Bidirectional }
        - name: sonarr
          image: lscr.io/linuxserver/sonarr:latest
          env:
            - { name: PUID, value: "1098" }
            - { name: PGID, value: "1098" } # correct var name -- fir's task set GUID (typo)
            - { name: TZ, value: "America/Phoenix" }
            - { name: DOCKER_MODS, value: "linuxserver/mods:radarr-striptracks" }
          volumeMounts:
            - { name: config, mountPath: /config }
            - { name: pool, mountPath: /pool, mountPropagation: HostToContainer }
            - { name: downloads, mountPath: /data/downloads }
          ports:
            - containerPort: 8989
      volumes:
        - { name: media1, persistentVolumeClaim: { claimName: media1 } }
        - { name: media2, persistentVolumeClaim: { claimName: media2 } }
        - { name: media3, persistentVolumeClaim: { claimName: media3 } }
        - { name: media4, persistentVolumeClaim: { claimName: media4 } }
        - { name: media5, persistentVolumeClaim: { claimName: media5 } }
        - { name: media6, persistentVolumeClaim: { claimName: media6 } }
        - { name: media7, persistentVolumeClaim: { claimName: media7 } }
        - { name: fuse, hostPath: { path: /dev/fuse, type: CharDevice } }
        - { name: pool, emptyDir: {} }
        - name: config
          persistentVolumeClaim: { claimName: sonarr-config }
        - name: downloads
          persistentVolumeClaim: { claimName: downloads }
