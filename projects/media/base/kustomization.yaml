apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - namespace.yaml
  - sabnzbd/deployment.yaml
  - sabnzbd/service.yaml
  - sabnzbd/pvc.yaml
  - sabnzbd/downloads-pvc.yaml
  - sabnzbd-reconcile/script-configmap.yaml
  - sabnzbd-reconcile/cronjob.yaml

generators:
  - secret-generator.yaml

# Remaining app directories (prowlarr/, tubesync/, radarr/, sonarr/,
# bazarr/) and buildarr/ get added here as each one migrates (see
# readme/gitops-migration.md Phase 5.5 sequence).
