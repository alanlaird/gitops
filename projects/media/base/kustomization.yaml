apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - namespace.yaml
  - pv-library.yaml
  - sabnzbd/deployment.yaml
  - sabnzbd/service.yaml
  - sabnzbd/pvc.yaml
  - sabnzbd/downloads-pvc.yaml
  - sabnzbd-reconcile/script-configmap.yaml
  - sabnzbd-reconcile/cronjob.yaml
  - prowlarr/deployment.yaml
  - prowlarr/service.yaml
  - prowlarr/pvc.yaml
  - prowlarr-reconcile/script-configmap.yaml
  - prowlarr-reconcile/cronjob.yaml
  - tubesync/deployment.yaml
  - tubesync/service.yaml
  - tubesync/pvc.yaml

generators:
  - secret-generator.yaml

# Remaining app directories (radarr/, sonarr/, bazarr/) and buildarr/ (if
# adopted — see prowlarr-reconcile/'s note on the Config management
# decision) get added here as each one migrates (see
# readme/gitops-migration.md Phase 5.5 sequence).
