apiVersion: apps/v1
kind: Deployment
metadata:
  name: homepage
  namespace: media
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
  selector:
    matchLabels: { app: homepage }
  template:
    metadata:
      labels: { app: homepage }
    spec:
      # fsGroup makes the emptyDir below group-writable by uid 1000 (the
      # app's own user) -- needed so the initContainer (root) and the app
      # container (non-root) can both write into it.
      securityContext:
        fsGroup: 1000
      initContainers:
        # Homepage's entrypoint auto-creates any of its known config files
        # that's missing on disk by copying a built-in default -- and it
        # gains new required files across releases (hit this twice on
        # :latest: kubernetes.yaml, then proxmox.yaml on a later pull).
        # Seeding a writable emptyDir from our ConfigMap, instead of
        # subPath-mounting a fixed filename list off a read-only
        # ConfigMap, means any future new file just gets auto-created
        # instead of crash-looping on EACCES.
        - name: seed-config
          image: busybox:latest
          command: ["sh", "-c", "cp -L /src/*.yaml /src/custom.* /config/ 2>/dev/null; true"]
          volumeMounts:
            - { name: config-src, mountPath: /src }
            - { name: config, mountPath: /config }
      containers:
        - name: homepage
          # Pinned to the digest already validated working (as of the
          # fix above) instead of :latest -- avoids another silent
          # mid-session upstream surprise; bump deliberately.
          image: ghcr.io/gethomepage/homepage@sha256:a0b71c8e757298d02560186bab9fbe3fc2d375c523a62cc1019177b37e48aa28
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: [ALL] }
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            seccompProfile: { type: RuntimeDefault }
          env:
            - name: MY_POD_IP
              valueFrom: { fieldRef: { fieldPath: status.podIP } }
            # value before the comma is required for the k8s probe -- see gethomepage.dev/installation/#homepage_allowed_hosts
            - { name: HOMEPAGE_ALLOWED_HOSTS, value: "$(MY_POD_IP):3000,media.laird.net" }
            # {{HOMEPAGE_FILE_*}} in services.yaml reads these paths at render time --
            # keeps API keys out of the (public) repo, reusing the same Secrets the
            # *-reconcile CronJobs already read.
            - { name: HOMEPAGE_FILE_RADARR_KEY, value: /run/secrets/radarr/api_key }
            - { name: HOMEPAGE_FILE_SONARR_KEY, value: /run/secrets/sonarr/api_key }
            - { name: HOMEPAGE_FILE_SABNZBD_KEY, value: /run/secrets/sabnzbd/api_key }
            - { name: HOMEPAGE_FILE_PROWLARR_KEY, value: /run/secrets/prowlarr/api_key }
            - { name: HOMEPAGE_FILE_PLEX_KEY, value: /run/secrets/plex/token }
            - { name: HOMEPAGE_FILE_TAUTULLI_KEY, value: /run/secrets/tautulli/api_key }
            - { name: HOMEPAGE_FILE_TRANSMISSION_USER, value: /run/secrets/webui-auth/username }
            - { name: HOMEPAGE_FILE_TRANSMISSION_PASS, value: /run/secrets/webui-auth/password }
          ports:
            - { name: http, containerPort: 3000 }
          livenessProbe:
            httpGet: { path: /api/healthcheck, port: http }
            initialDelaySeconds: 5
            periodSeconds: 15
          volumeMounts:
            - { name: config, mountPath: /app/config }
            - { name: radarr-secrets, mountPath: /run/secrets/radarr, readOnly: true }
            - { name: sonarr-secrets, mountPath: /run/secrets/sonarr, readOnly: true }
            - { name: sabnzbd-secrets, mountPath: /run/secrets/sabnzbd, readOnly: true }
            - { name: prowlarr-secrets, mountPath: /run/secrets/prowlarr, readOnly: true }
            - { name: plex-secrets, mountPath: /run/secrets/plex, readOnly: true }
            - { name: tautulli-secrets, mountPath: /run/secrets/tautulli, readOnly: true }
            - { name: webui-auth, mountPath: /run/secrets/webui-auth, readOnly: true }
      volumes:
        - { name: config-src, configMap: { name: homepage-config } }
        - { name: config, emptyDir: {} }
        - { name: radarr-secrets, secret: { secretName: radarr-secrets } }
        - { name: sonarr-secrets, secret: { secretName: sonarr-secrets } }
        - { name: sabnzbd-secrets, secret: { secretName: sabnzbd-secrets } }
        - { name: prowlarr-secrets, secret: { secretName: prowlarr-secrets } }
        - { name: plex-secrets, secret: { secretName: plex-secrets } }
        - { name: tautulli-secrets, secret: { secretName: tautulli-secrets } }
        - { name: webui-auth, secret: { secretName: webui-auth } }
