# Replaces the hand-rolled caddy+static-HTML landing page (landing/) with
# gethomepage.dev -- same "no build step, edit the ConfigMap and roll the
# pod" operating model, but with a real upstream handling per-app API
# integrations instead of us hand-rolling status polling. Radarr/Sonarr/
# SABnzbd/Prowlarr widgets read their API keys via {{HOMEPAGE_FILE_*}},
# populated from the same *-secrets Secrets the reconcile CronJobs use
# (see deployment.yaml's volumeMounts) -- no keys live in this file.
# Plex/Tautulli widgets and the network-traffic gauge are a later pass.
apiVersion: v1
kind: ConfigMap
metadata:
  name: homepage-config
  namespace: media
data:
  settings.yaml: |
    title: media
    theme: dark
    headerStyle: clean

  bookmarks.yaml: ""

  widgets.yaml: ""

  # Present but empty -- not enabling cluster auto-discovery (no RBAC
  # granted for it), just avoids the entrypoint's copy-on-missing step,
  # which needs a writable /app/config that our non-root securityContext
  # doesn't allow (EACCES, crash-loops).
  kubernetes.yaml: ""

  docker.yaml: ""

  custom.css: ""

  custom.js: ""

  services.yaml: |
    - media:
        - Plex:
            href: http://arago.laird.net:32400
            description: Media server (arago)

        - Radarr:
            href: http://radarr.laird.net:7878
            description: Movie management (taloshw k8s)
            widget:
              type: radarr
              url: http://radarr.laird.net:7878
              key: "{{HOMEPAGE_FILE_RADARR_KEY}}"
              fields: ["movies", "missing", "queued"]

        - Sonarr:
            href: http://sonarr.laird.net:8989
            description: TV management (taloshw k8s)
            widget:
              type: sonarr
              url: http://sonarr.laird.net:8989
              key: "{{HOMEPAGE_FILE_SONARR_KEY}}"
              fields: ["series", "wanted", "queued"]

        - SABnzbd:
            href: http://sabnzbd.laird.net:8080
            description: Usenet downloader (taloshw k8s)
            widget:
              type: sabnzbd
              url: http://sabnzbd.laird.net:8080
              key: "{{HOMEPAGE_FILE_SABNZBD_KEY}}"

        - Prowlarr:
            href: http://prowlarr.laird.net:9696
            description: Indexer management (taloshw k8s)
            widget:
              type: prowlarr
              url: http://prowlarr.laird.net:9696
              key: "{{HOMEPAGE_FILE_PROWLARR_KEY}}"
              fields: ["numberOfGrabs", "numberOfQueries"]

        - Bazarr:
            href: http://bazarr.laird.net:6767
            description: Subtitle management (taloshw k8s)

        - Tubesync:
            href: http://tubesync.laird.net:4848
            description: YouTube archiving (taloshw k8s)

        - Transmission:
            href: http://transmission.laird.net:9091
            description: BitTorrent client (taloshw k8s)

        - Tautulli:
            href: http://arago.laird.net:8181
            description: Plex analytics (arago)

        - Seerr:
            href: http://fir:5055
            description: Request management (fir)

        - Maintainerr:
            href: http://fir:6246
            description: Collection cleanup (fir)
