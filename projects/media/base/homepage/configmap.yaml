# Replaces the hand-rolled caddy+static-HTML landing page (landing/) with
# gethomepage.dev -- same "no build step, edit the ConfigMap and roll the
# pod" operating model, but with a real upstream handling per-app API
# integrations instead of us hand-rolling status polling. Starting minimal
# (plain links only, matching the old page) -- widgets get added
# per-service later.
apiVersion: v1
kind: ConfigMap
metadata:
  name: homepage-config
  namespace: media
data:
  settings.yaml: |
    title: media
    theme: dark
    headerStyle: clean

  bookmarks.yaml: ""

  widgets.yaml: ""

  docker.yaml: ""

  custom.css: ""

  custom.js: ""

  services.yaml: |
    - media:
        - Plex:
            href: http://arago.laird.net:32400
            description: Media server (arago)

        - Radarr:
            href: http://radarr.laird.net:7878
            description: Movie management (taloshw k8s)

        - Sonarr:
            href: http://sonarr.laird.net:8989
            description: TV management (taloshw k8s)

        - SABnzbd:
            href: http://sabnzbd.laird.net:8080
            description: Usenet downloader (taloshw k8s)

        - Prowlarr:
            href: http://prowlarr.laird.net:9696
            description: Indexer management (taloshw k8s)

        - Bazarr:
            href: http://bazarr.laird.net:6767
            description: Subtitle management (taloshw k8s)

        - Tubesync:
            href: http://tubesync.laird.net:4848
            description: YouTube archiving (taloshw k8s)

        - Transmission:
            href: http://transmission.laird.net:9091
            description: BitTorrent client (taloshw k8s)

        - Tautulli:
            href: http://arago.laird.net:8181
            description: Plex analytics (arago)

        - Seerr:
            href: http://fir:5055
            description: Request management (fir)

        - Maintainerr:
            href: http://fir:6246
            description: Collection cleanup (fir)
