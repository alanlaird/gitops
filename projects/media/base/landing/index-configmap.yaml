apiVersion: v1
kind: ConfigMap
metadata:
  name: media-landing-index
  namespace: media
data:
  index.html: |
    <!DOCTYPE html>
    <html lang="en">
    <head>
      <meta charset="UTF-8">
      <meta name="viewport" content="width=device-width, initial-scale=1.0">
      <title>media</title>
      <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
          background: #0f0f13;
          color: #c8c8d0;
          font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
          min-height: 100vh;
          display: flex;
          flex-direction: column;
          align-items: center;
          padding: 48px 24px;
        }

        h1 {
          font-size: 1.1rem;
          font-weight: 500;
          letter-spacing: 0.15em;
          text-transform: uppercase;
          color: #555566;
          margin-bottom: 40px;
        }

        .grid {
          display: grid;
          grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
          gap: 14px;
          width: 100%;
          max-width: 860px;
        }

        a {
          display: flex;
          flex-direction: column;
          gap: 6px;
          padding: 20px 22px;
          background: #18181f;
          border: 1px solid #26262e;
          border-radius: 8px;
          text-decoration: none;
          color: inherit;
          transition: border-color 0.15s, background 0.15s;
        }

        a:hover {
          background: #1e1e27;
          border-color: #4a4a60;
        }

        .name {
          font-size: 1rem;
          font-weight: 600;
          color: #dddde8;
        }

        .desc {
          font-size: 0.78rem;
          color: #606070;
        }

        .port {
          font-size: 0.72rem;
          color: #3a3a50;
          margin-top: 4px;
          font-family: ui-monospace, monospace;
        }
      </style>
    </head>
    <body>
      <h1>media</h1>
      <div class="grid">

        <a href="http://arago.laird.net:32400">
          <span class="name">Plex</span>
          <span class="desc">Media server (arago)</span>
          <span class="port">:32400</span>
        </a>

        <a href="http://radarr.laird.net:7878">
          <span class="name">Radarr</span>
          <span class="desc">Movie management (taloshw k8s)</span>
          <span class="port">:7878</span>
        </a>

        <a href="http://sonarr.laird.net:8989">
          <span class="name">Sonarr</span>
          <span class="desc">TV management (taloshw k8s)</span>
          <span class="port">:8989</span>
        </a>

        <a href="http://sabnzbd.laird.net:8080">
          <span class="name">SABnzbd</span>
          <span class="desc">Usenet downloader (taloshw k8s)</span>
          <span class="port">:8080</span>
        </a>

        <a href="http://prowlarr.laird.net:9696">
          <span class="name">Prowlarr</span>
          <span class="desc">Indexer management (taloshw k8s)</span>
          <span class="port">:9696</span>
        </a>

        <a href="http://bazarr.laird.net:6767">
          <span class="name">Bazarr</span>
          <span class="desc">Subtitle management (taloshw k8s)</span>
          <span class="port">:6767</span>
        </a>

        <a href="http://tubesync.laird.net:4848">
          <span class="name">Tubesync</span>
          <span class="desc">YouTube archiving (taloshw k8s)</span>
          <span class="port">:4848</span>
        </a>

        <a href="http://arago.laird.net:8181">
          <span class="name">Tautulli</span>
          <span class="desc">Plex analytics (arago)</span>
          <span class="port">:8181</span>
        </a>

        <a href="http://fir:5055">
          <span class="name">Seerr</span>
          <span class="desc">Request management (fir)</span>
          <span class="port">:5055</span>
        </a>

        <a href="http://fir:6246">
          <span class="name">Maintainerr</span>
          <span class="desc">Collection cleanup (fir)</span>
          <span class="port">:6246</span>
        </a>

      </div>
    </body>
    </html>
