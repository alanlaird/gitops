apiVersion: batch/v1
kind: CronJob
metadata:
  name: prowlarr-reconcile
  namespace: media
spec:
  schedule: "0 * * * *" # hourly, same cadence as sabnzbd-reconcile
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        spec:
          restartPolicy: Never
          # prowlarr-config is RWO Longhorn — node-scoped, not pod-scoped.
          # Must land on the same node as the running prowlarr pod, or the
          # mount hangs (same reasoning as sabnzbd-reconcile).
          affinity:
            podAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
                - labelSelector:
                    matchLabels: { app: prowlarr }
                  topologyKey: kubernetes.io/hostname
          containers:
            - name: reconcile
              image: python:3-alpine
              command: ["python3", "/scripts/reconcile.py"]
              env:
                - { name: PROWLARR_API_KEY, valueFrom: { secretKeyRef: { name: prowlarr-secrets, key: api_key } } }
                - { name: WEBUI_USERNAME, valueFrom: { secretKeyRef: { name: webui-auth, key: username } } }
                - { name: WEBUI_PASSWORD, valueFrom: { secretKeyRef: { name: webui-auth, key: password } } }
              volumeMounts:
                - { name: script, mountPath: /scripts }
                - { name: config, mountPath: /config, readOnly: true }
          volumes:
            - name: script
              configMap:
                name: prowlarr-reconcile-script
                defaultMode: 0755
            - name: config
              persistentVolumeClaim:
                claimName: prowlarr-config
                readOnly: true
